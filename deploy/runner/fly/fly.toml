app = "traceharness-runner"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 300

[env]
RUNNER_EXECUTION_ENABLED = "0"
RUNNER_DOCKER = "/usr/local/bin/docker"
RUNNER_MAX_WORKERS = "1"
RUNNER_MAX_ACTIVE_PER_OWNER = "1"

[[mounts]]
source = "runner_data"
destination = "/data"

[[services]]
protocol = "tcp"
internal_port = 8743
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]
  [[services.tcp_checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "180s"

[[vm]]
cpu_kind = "shared"
cpus = 4
memory = "8gb"
