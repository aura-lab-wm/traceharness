# Continuous delivery. Runs ONLY when a maintainer pushes a version tag (v0.5.0, ...): nothing is
# published by a pull request or by a push to main.
#
#   1. the tag must equal pyproject.toml's version;
#   2. the whole CI workflow runs again on the tagged commit;
#   3. the wheel and the school package are built, checksummed, and given SLSA build provenance;
#   4. a GitHub Release is created with those files (notes generated from merged PRs);
#   5. the container image is pushed to ghcr.io/aura-lab-wm/traceharness:<version> and :latest,
#      with its own provenance attestation.
#
# Write scopes are granted per job, only where that job needs them. No repository secret is used:
# the release and the registry push use the workflow's own GITHUB_TOKEN, and attestations use OIDC.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  ci:
    name: CI on the tagged commit
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build, checksum, attest
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write          # OIDC for the provenance signature
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: traceharness/frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r traceharness/requirements.txt
      # school package first (it ships the committed dist/; the wheel step rebuilds it)
      - name: School package (clean-room verified)
        run: python scripts/build_school_package.py --out "dist/traceharness-school-${VERSION}.zip" --verify
      - name: Wheel (console included)
        run: make wheel PY=python
      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum traceharness-*.whl "traceharness-school-${VERSION}.zip" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/traceharness-*.whl
            dist/traceharness-school-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/traceharness-*.whl
            dist/traceharness-school-*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "TraceHarness $VERSION" --generate-notes

  image:
    name: Container image to GHCR
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push to ghcr.io/<owner>/traceharness
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
