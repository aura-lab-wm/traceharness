# Weekly updates, grouped so a week's minor and patch bumps arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /traceharness/frontend
    schedule:
      interval: weekly
    groups:
      console-minor-and-patch:
        update-types: [minor, patch]
