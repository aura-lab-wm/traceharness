<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TraceHarness</title>
    <meta name="description" content="Measure LLM coding agents, not score them: every run of every harness, down to the recorded action.">
    <meta name="color-scheme" content="light dark">
    <!-- No webfont link. IBM Plex Mono is vendored (src/fonts) and inlined into the CSS bundle,
         and words are set in the system grotesk, so the page renders identically served, exported, or opened
         from file:// with no network at all. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
      /* The page before the bundle runs. It is never blank: the mark while the workbench loads,
         and a plain explanation if it never does. React replaces #root on mount. */
      html,body{margin:0;background:#f4f4ef;color:#242623}
      html.hl-dark,html.hl-dark body{background:#1a1c1c;color:#f1f2ef}
      html.hl-hc,html.hl-hc body{background:#000;color:#fff}
      html.hl-hcl,html.hl-hcl body{background:#fff;color:#000}
      /* The bundle's stylesheet loads after this one and gives html, body and the app root the classic dark
         ground. The boot block covers the window and paints the theme's ground itself, so the first paint is
         the theme the workbench opens in (no dark flash before a light workbench). */
      .hl-boot{background:#f4f4ef;color:#242623}
      html.hl-dark .hl-boot{background:#1a1c1c;color:#f1f2ef}
      html.hl-hc .hl-boot{background:#000;color:#fff}
      html.hl-hcl .hl-boot{background:#fff;color:#000}
      .hl-boot{position:fixed;inset:0;display:grid;place-items:center;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
      .hl-boot-in{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:520px;padding:24px;text-align:center}
      .hl-mark{animation:hl-pulse 1.4s ease-in-out infinite}
      .hl-boot b{font-weight:600;font-size:15px}
      .hl-boot p{margin:0;opacity:.72}
      .hl-boot code{white-space:nowrap;font:12px/1.5 ui-monospace,Menlo,monospace;padding:2px 6px;border-radius:5px;background:rgba(127,127,127,.16)}
      .hl-boot[data-state="failed"] .hl-mark{animation:none}
      @keyframes hl-pulse{50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){.hl-mark{animation:none}}
    </style>
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('rig.theme') } catch (e) {}
        var mm = function (q) { return !!(window.matchMedia && matchMedia(q).matches) }
        var sys = t === 'system' && (mm('(prefers-color-scheme: light)') ? (mm('(prefers-contrast: more)') ? 'contrast-light' : 'light') : (mm('(prefers-contrast: more)') ? 'contrast' : 'dark'))
        var cls = { dark: 'hl-dark', contrast: 'hl-hc', 'contrast-light': 'hl-hcl' }[sys || t]
        if (cls) document.documentElement.className += ' ' + cls
        function esc(v) {
          return String(v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] })
        }
        function fail(why) {
          var el = document.getElementById('hl-boot')
          if (!el || el.getAttribute('data-state') === 'failed') return
          el.setAttribute('data-state', 'failed')
          var served = location.protocol === 'http:' || location.protocol === 'https:'
          el.querySelector('.hl-boot-in').innerHTML =
            '<span class="hl-mark"></span><b>The TraceHarness interface did not load.</b>' +
            '<p>' + esc(why) + '</p>' +
            (served
              ? '<p>If you changed the frontend, rebuild it, then reload:<br><code>cd traceharness/frontend &amp;&amp; npm run build</code></p><p>The API is still running; your recorded runs are untouched.</p>'
              : '<p>This exported file may be incomplete. Export it again with <code>python -m traceharness --export</code>.</p>')
        }
        // a script or stylesheet that 404s (a stale index.html pointing at a deleted bundle)
        window.addEventListener('error', function (e) {
          var n = e && e.target
          if (n && (n.tagName === 'SCRIPT' || n.tagName === 'LINK')) fail('A file it needs could not be fetched: ' + (n.src || n.href || 'unknown') + '.')
        }, true)
        // or a bundle that loads but never mounts
        setTimeout(function () { if (document.getElementById('hl-boot')) fail('It did not start within 15 seconds.') }, 15000)
      })()
    </script>
  </head>
  <body>
    <div id="root"><div class="hl-boot" id="hl-boot" role="status" aria-live="polite"><div class="hl-boot-in"><svg class="hl-mark" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#b74924"/><path d="M5 16l4-5 3 2.5 3.5-6 3.5 4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><b>TraceHarness</b><p>Loading the workbench…</p></div></div></div>
    <noscript><div class="hl-boot"><div class="hl-boot-in"><b>TraceHarness needs JavaScript.</b><p>Turn it on for this page and reload.</p></div></div></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
