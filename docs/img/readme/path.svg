<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="path-title path-desc">
  <title id="path-title">Record, compare, read</title>
  <desc id="path-desc">Three-step workflow on paper ground: 1. Record on the operator machine with allow-list, redaction, and typing yes; 2. Compare harness by model by task on included datasets; 3. Read the full trajectory alongside pass/fail.</desc>
  <style>
    .rule { stroke: rgba(37,42,41,.14); stroke-width: 1; }
  </style>

  <!-- Chalk paper ground and outer 1px border -->
  <rect width="1200" height="280" fill="#f4f4ef"/>
  <rect x="0.5" y="0.5" width="1199" height="279" fill="none" class="rule"/>

  <!-- Top figure header -->
  <text x="28" y="33" font-family="ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="1.2" fill="#b74924">WORKFLOW · RECORD, COMPARE, READ</text>
  <text x="1172" y="33" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#242623" fill-opacity="0.62">LOCAL CONSOLE &amp; TRACEHARNESS.DEV</text>
  <line x1="28" y1="47.5" x2="1172" y2="47.5" class="rule"/>

  <!-- Step 1 Card: x=28..384 (width 356) -->
  <rect x="28.5" y="64.5" width="355" height="191" rx="3" fill="#f4f4ef" class="rule"/>
  <rect x="28" y="64" width="64" height="2" fill="#b74924"/>
  <line x1="28.5" y1="98.5" x2="383.5" y2="98.5" class="rule"/>
  <text x="44" y="85" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#b74924">STEP 01</text>
  <text x="368" y="85" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5" fill="#242623" fill-opacity="0.6">OPERATOR MACHINE</text>

  <text x="44" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#242623">Record on your machine</text>
  <text x="44" y="149" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#242623" fill-opacity="0.72">Local consent gates every synced session.</text>

  <!-- Step 1 inset instrument -->
  <rect x="44.5" y="166.5" width="323" height="73" rx="2" fill="#242623" fill-opacity="0.035" class="rule"/>
  <rect x="54.5" y="178.5" width="94" height="49" rx="2" fill="#f4f4ef" class="rule"/>
  <text x="101.5" y="199" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#242623">allow-list</text>
  <text x="101.5" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#242623" fill-opacity="0.62">capture.json</text>

  <line x1="151" y1="203" x2="157" y2="203" stroke="#242623" stroke-opacity="0.45"/>
  <rect x="159.5" y="178.5" width="94" height="49" rx="2" fill="#f4f4ef" class="rule"/>
  <text x="206.5" y="199" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#242623">redaction</text>
  <text x="206.5" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#242623" fill-opacity="0.62">[redacted:*]</text>

  <line x1="256" y1="203" x2="262" y2="203" stroke="#242623" stroke-opacity="0.45"/>
  <rect x="264.5" y="178.5" width="93" height="49" rx="2" fill="#f4f4ef" stroke="#b74924"/>
  <text x="311" y="199" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#b74924">type yes</text>
  <text x="311" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#242623" fill-opacity="0.62">local TTY</text>

  <!-- Connector 1 -> 2 -->
  <line x1="391" y1="160" x2="414" y2="160" stroke="#b74924" stroke-width="1.25"/>
  <polyline points="409,155.5 414.5,160 409,164.5" fill="none" stroke="#b74924" stroke-width="1.25"/>

  <!-- Step 2 Card: x=422..778 (width 356) -->
  <rect x="422.5" y="64.5" width="355" height="191" rx="3" fill="#f4f4ef" class="rule"/>
  <rect x="422" y="64" width="64" height="2" fill="#b74924"/>
  <line x1="422.5" y1="98.5" x2="777.5" y2="98.5" class="rule"/>
  <text x="438" y="85" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#b74924">STEP 02</text>
  <text x="762" y="85" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5" fill="#242623" fill-opacity="0.6">INCLUDED DATASETS</text>

  <text x="438" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#242623">Compare harness × model × task</text>
  <text x="438" y="149" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#242623" fill-opacity="0.72">Inspect recorded factorials offline on disk.</text>

  <!-- Step 2 inset instrument -->
  <rect x="438.5" y="166.5" width="323" height="73" rx="2" fill="#242623" fill-opacity="0.035" class="rule"/>
  <!-- Mini 3x4 ruled matrix -->
  <rect x="450.5" y="179.5" width="22" height="13" fill="#f4f4ef" class="rule"/>
  <rect x="476.5" y="179.5" width="22" height="13" fill="#242623" fill-opacity="0.14" stroke="#242623"/>
  <rect x="502.5" y="179.5" width="22" height="13" fill="#f4f4ef" class="rule"/>
  <rect x="528.5" y="179.5" width="22" height="13" fill="#b74924" fill-opacity="0.14" stroke="#b74924"/>

  <rect x="450.5" y="196.5" width="22" height="13" fill="#b74924" fill-opacity="0.14" stroke="#b74924"/>
  <rect x="476.5" y="196.5" width="22" height="13" fill="#f4f4ef" class="rule"/>
  <rect x="502.5" y="196.5" width="22" height="13" fill="#f4f4ef" class="rule"/>
  <rect x="528.5" y="196.5" width="22" height="13" fill="#242623" fill-opacity="0.14" stroke="#242623"/>

  <rect x="450.5" y="213.5" width="22" height="13" fill="#f4f4ef" class="rule"/>
  <rect x="476.5" y="213.5" width="22" height="13" fill="#f4f4ef" class="rule"/>
  <rect x="502.5" y="213.5" width="22" height="13" fill="#242623" fill-opacity="0.14" stroke="#242623"/>
  <rect x="528.5" y="213.5" width="22" height="13" fill="#b74924" fill-opacity="0.14" stroke="#b74924"/>

  <text x="566" y="191" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#242623">8 datasets shipped</text>
  <text x="566" y="208" font-family="ui-monospace, monospace" font-size="10" fill="#242623" fill-opacity="0.68">2,709 / 3,453 real runs</text>
  <text x="566" y="224" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#b74924">no API key to replay</text>

  <!-- Connector 2 -> 3 -->
  <line x1="785" y1="160" x2="808" y2="160" stroke="#b74924" stroke-width="1.25"/>
  <polyline points="803,155.5 808.5,160 803,164.5" fill="none" stroke="#b74924" stroke-width="1.25"/>

  <!-- Step 3 Card: x=816..1172 (width 356) -->
  <rect x="816.5" y="64.5" width="355" height="191" rx="3" fill="#f4f4ef" class="rule"/>
  <rect x="816" y="64" width="64" height="2" fill="#b74924"/>
  <line x1="816.5" y1="98.5" x2="1171.5" y2="98.5" class="rule"/>
  <text x="832" y="85" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#b74924">STEP 03</text>
  <text x="1156" y="85" text-anchor="end" font-family="ui-monospace, monospace" font-size="10.5" fill="#242623" fill-opacity="0.6">TRAJECTORY VIEW</text>

  <text x="832" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#242623">Read the trajectory</text>
  <text x="832" y="149" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#242623" fill-opacity="0.72">Examine action sequences beyond pass/fail.</text>

  <!-- Step 3 inset instrument: ordered action sequence -->
  <rect x="832.5" y="166.5" width="323" height="73" rx="2" fill="#242623" fill-opacity="0.035" class="rule"/>
  <line x1="862" y1="191.5" x2="1126" y2="191.5" stroke="#242623" stroke-opacity="0.32"/>

  <rect x="858.5" y="187.5" width="8" height="8" fill="#f4f4ef" stroke="#242623"/>
  <text x="862.5" y="211" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#242623">reads</text>

  <rect x="923.5" y="187.5" width="8" height="8" fill="#f4f4ef" stroke="#242623"/>
  <text x="927.5" y="211" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#242623">edits</text>

  <rect x="989.5" y="187.5" width="8" height="8" fill="#f4f4ef" stroke="#242623"/>
  <text x="993.5" y="211" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#242623">commands</text>

  <rect x="1056.5" y="187.5" width="8" height="8" fill="#f4f4ef" stroke="#242623"/>
  <text x="1060.5" y="211" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#242623">tests</text>

  <rect x="1121.5" y="187.5" width="8" height="8" fill="#b74924" stroke="#b74924"/>
  <text x="1125.5" y="211" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#b74924">patch</text>

  <text x="994" y="230" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#242623" fill-opacity="0.62">ordered actions · model replies · summary · final patch</text>
</svg>
